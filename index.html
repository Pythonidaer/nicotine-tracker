<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pouch Tracker">
  <title>Pouch Tracker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preload" href="./fonts/oswald-latin.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="./fonts/merriweather-latin.ttf" as="font" type="font/ttf" crossorigin>
  <script src="./theme.js?v=53"></script>
  <link rel="stylesheet" href="./style.css?v=53">
</head>
<body>
<div id="pouch-preview">
  <a class="skip-link" href="#pouch-content">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#" data-view="today" aria-label="Pouch Tracker home">
      <img src="./icons/pouch.svg" width="28" height="28" alt="">
      <span>Pouch Tracker</span>
    </a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="app-navigation" aria-expanded="false">
      <svg class="material-icon menu-open-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      <svg class="material-icon menu-close-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
    </button>
    <nav id="app-navigation" aria-label="App navigation" hidden>
      <button type="button" data-view="craving">Fight the craving</button>
      <button type="button" data-view="resources">Quitting nicotine</button>
      <button type="button" data-view="settings">Settings</button>
      <label class="theme-toggle" for="theme-toggle"><span>Dark mode</span><input id="theme-toggle" type="checkbox" role="switch"><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span></label>
    </nav>
  </header>
  <nav class="primary-navigation" aria-label="Tracking"><button type="button" data-view="today" aria-current="page">Today</button><button type="button" data-view="history">History</button><button type="button" data-view="trends">Trends</button></nav>
  <main id="pouch-content" tabindex="-1"></main>
  <dialog id="craving-prompt" aria-labelledby="craving-prompt-title" aria-describedby="craving-prompt-detail">
    <h2 id="craving-prompt-title">Challenge the craving first?</h2>
    <p class="caption" id="craving-prompt-detail"></p>
    <p>Would you like to try a short number puzzle before deciding?</p>
    <div class="form-actions"><button type="button" class="primary" data-action="prompt-sudoku" autofocus>Play Sudoku</button><button type="button" data-action="prompt-log">Log anyway</button><button type="button" class="link" data-action="prompt-cancel">Cancel</button></div>
  </dialog>
</div>
<script src="./resources.js?v=53"></script>
<script src="./tapering.js?v=53"></script>
<script src="./sudoku.js?v=53"></script>
<script src="./icons.js?v=53"></script>
<script src="./app.js?v=53"></script>
</body>
</html>
